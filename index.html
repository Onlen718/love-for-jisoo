<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Jisoo ❤️</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Эффект вспышки при старте */
        #flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease-out;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Стили для кнопки (с эффектом стекла) */
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 45px;
            background: rgba(255, 77, 148, 0.1);
            backdrop-filter: blur(10px);
            color: #ff4d94;
            border: 1px solid rgba(255, 77, 148, 0.5);
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 30px rgba(255, 77, 148, 0.3);
            text-transform: uppercase;
            letter-spacing: 4px;
            z-index: 10;
        }

        #start-btn:hover {
            background: rgba(255, 77, 148, 0.3);
            box-shadow: 0 0 50px rgba(255, 77, 148, 0.8);
            transform: translate(-50%, -50%) scale(1.05);
        }

        #message {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            opacity: 0;
            transition: opacity 3s, transform 3s;
            text-shadow: 0 0 15px #ff4d94, 0 0 30px #ff4d94;
            font-size: 1.3rem;
            line-height: 1.6;
            z-index: 10;
            transform: translateY(20px);
        }
        
        audio { display: none; }
    </style>
</head>
<body>

    <div id="flash"></div>
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <button id="start-btn">Нажми ❤️</button>
    <canvas id="canvas"></canvas>
    <div id="message">I Love You So, Jisoo...<br><span style="font-size: 1rem; color: #ccc; letter-spacing: 2px;">Your Oppa</span></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Оптимизация
        const startBtn = document.getElementById('start-btn');
        const music = document.getElementById('bg-music');
        const message = document.getElementById('message');
        const flash = document.getElementById('flash');

        let width, height, cx, cy;
        let particles = [];
        let isAnimating = false;
        let timeOffset = 0;

        // Настройка размера экрана
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(isStar = false) {
                this.isStar = isStar;
                this.reset();
            }

            reset() {
                if (this.isStar) {
                    // Фоновые космические звезды
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.z = Math.random() * 2 + 0.5; // Глубина для параллакса
                    this.size = Math.random() * 1.5;
                    this.color = '#ffffff';
                    this.speedX = (Math.random() - 0.5) * 0.2;
                    this.speedY = (Math.random() - 0.5) * 0.2;
                } else {
                    // Частицы сердца
                    let t = Math.random() * Math.PI * 2;
                    let scale = Math.min(width, height) / 45;
                    
                    // Математическая формула сердца
                    let x = 16 * Math.pow(Math.sin(t), 3);
                    let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    
                    // Добавляем легкий разброс для "туманности"
                    let offsetX = (Math.random() - 0.5) * 20;
                    let offsetY = (Math.random() - 0.5) * 20;

                    this.baseX = cx + (x * scale) + offsetX;
                    this.baseY = cy + (y * scale) + offsetY;
                    
                    this.x = this.baseX;
                    this.y = this.baseY;
                    
                    // Размеры частиц от маленьких до больших для объема
                    this.size = Math.random() * 2.5 + 0.5;
                    
                    // Палитра: красный, розовый, фиолетовый
                    const colors = ['#ff0055', '#ff4d94', '#ff80bf', '#d500f9', '#ff1a66'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = Math.random() * 0.02 + 0.005;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = (Math.random() - 0.5) * 2;
                }
                
                this.alpha = 0; // Изначально прозрачные (для плавного появления)
                this.targetAlpha = Math.random() * 0.8 + 0.2;
                this.alphaSpeed = Math.random() * 0.03 + 0.01;
            }

            update(time) {
                // Плавное появление частиц
                if (this.alpha < this.targetAlpha) {
                    this.alpha += this.alphaSpeed;
                } else {
                    // Мерцание после появления
                    this.alpha += Math.sin(time * 0.002 + this.angle) * 0.02;
                    if(this.alpha < 0.1) this.alpha = 0.1;
                    if(this.alpha > 1) this.alpha = 1;
                }

                if (this.isStar) {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                        this.reset();
                    }
                } else {
                    // Плавное появление из центра (эффект разлета)
                    if (time - timeOffset < 1500) {
                        // Первые 1.5 секунды частицы вылетают из центра экрана
                        this.x += (this.baseX - cx) * 0.05;
                        this.y += (this.baseY - cy) * 0.05;
                    } else {
                        // Потом начинается пульсация
                        this.angle += this.speed;
                        let pulse = 1 + Math.sin(time * 0.003) * 0.15; // Пульс
                        this.x = this.baseX + Math.cos(this.angle) * 3 * pulse;
                        this.y = this.baseY + Math.sin(this.angle) * 3 * pulse;
                    }
                }
            }

            draw() {
                // Эффект свечения (как в Инстаграме)
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                
                // Если частица большая, делаем ей свечение
                if (this.size > 1.5) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 2000; i++) particles.push(new Particle(false));
            for (let i = 0; i < 150; i++) particles.push(new Particle(true));
        }

        function animate(time) {
            if (!isAnimating) return;

            // Фон с эффектом "шлейфа" (фейд)
            // Цвет фона - очень темный фиолетовый
            ctx.fillStyle = 'rgba(5, 0, 10, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            // Включаем режим сложения цветов (создает эффект неона/тумана)
            ctx.globalCompositeOperation = 'lighter';

            for (let p of particles) {
                p.update(time);
                p.draw();
            }

            // Возвращаем режим обратно
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            
            // Вспышка при старте
            flash.style.opacity = 1;
            setTimeout(() => {
                flash.style.opacity = 0;
                // Очищаем экран перед анимацией
                ctx.fillStyle = '#050005';
                ctx.fillRect(0, 0, width, height);
            }, 100);

            music.play().catch(e => console.log("Музыка ждет клика"));
            
            timeOffset = performance.now();
            init();
            isAnimating = true;
            requestAnimationFrame(animate);

            setTimeout(() => {
                message.style.opacity = 1;
                message.style.transform = 'translateY(0)';
            }, 3000);
        });
    </script>
</body>
</html>
