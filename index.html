<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Jisoo ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Холст для рисования */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        audio {
            display: none;
        }

        /* Кнопка запуска */
        #start-btn {
            position: relative;
            z-index: 10;
            padding: 15px 40px;
            background-color: transparent;
            color: #ff4d94;
            border: 2px solid #ff4d94;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            box-shadow: 0 0 20px rgba(255, 77, 148, 0.4);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        #start-btn:hover {
            background-color: #ff4d94;
            color: #000;
            box-shadow: 0 0 40px rgba(255, 77, 148, 0.8);
            transform: scale(1.05);
        }

        /* Текст, который появится позже */
        #message {
            position: absolute;
            bottom: 40px;
            z-index: 10;
            font-size: 1.2rem;
            text-align: center;
            width: 100%;
            color: #fff;
            opacity: 0;
            transition: opacity 4s;
            text-shadow: 0 0 10px #ff4d94;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <button id="start-btn">Открыть моё сердце ❤️</button>
    <canvas id="heartCanvas"></canvas>

    <div id="message">
        I Love You So, Jisoo...<br>
        <span style="font-size: 0.9rem; color: #ccc;">Твой Oppa 🛠️</span>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const music = document.getElementById('bg-music');
        const message = document.getElementById('message');

        let width, height, cx, cy;
        let lines = [];
        let animationFrame;
        let isStarted = false;

        // Настраиваем размер холста под экран телефона
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Класс для каждой "линии" (луча)
        class Line {
            constructor(t) {
                // Формула сердечка, как в твоем коде на Python
                // t - это угол от 0 до 2Пи
                let scale = Math.min(width, height) / 45; // Подгоняем размер под экран
                
                // Вычисляем внешнюю точку сердца
                let x0 = 16 * Math.pow(Math.sin(t), 3);
                let y0 = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                
                this.ex = cx + x0 * scale;
                this.ey = cy + y0 * scale;

                // Вычисляем внутреннюю точку (случайно, чтобы создать объем)
                let lenFactor = 0.15 + Math.random() * 0.35; 
                
                // Начальная точка (ближе к центру)
                this.sx = cx + x0 * scale * (1 - lenFactor);
                this.sy = cy + y0 * scale * (1 - lenFactor);

                // Цвета: плавный переход от белого к розовому и темно-красному
                let colorRand = Math.random();
                if (colorRand > 0.8) {
                    this.color = '#ffffff'; // Белые блики
                } else if (colorRand > 0.3) {
                    this.color = '#ff4d94'; // Розовый
                } else {
                    this.color = '#a30029'; // Темно-красный (глубина)
                }

                // Прозрачность
                this.alpha = Math.random() * 0.5 + 0.1;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.sx, this.sy);
                ctx.lineTo(this.ex, this.ey);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 1.2;
                ctx.globalAlpha = this.alpha;
                
                // Легкое свечение для красоты
                ctx.shadowBlur = 5;
                ctx.shadowColor = this.color;
                
                ctx.stroke();
                ctx.closePath();
            }
        }

        // Генерируем 1000 линий для заполнения сердца
        function createHeart() {
            lines = [];
            const numLines = 1500; // Чем больше, тем плотнее сердце
            
            for (let i = 0; i < numLines; i++) {
                // Случайный угол
                let t = Math.random() * Math.PI * 2;
                lines.push(new Line(t));
            }
        }

        // Анимация (постепенное проявление)
        let drawProgress = 0;
        function animate() {
            // Очищаем экран с эффектом шлейфа
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; 
            ctx.fillRect(0, 0, width, height);

            // Постепенно увеличиваем количество отрисованных линий
            if (drawProgress < lines.length) {
                drawProgress += 15; // Скорость прорисовки
            }

            // Рисуем линии
            for (let i = 0; i < drawProgress && i < lines.length; i++) {
                lines[i].draw();
            }

            animationFrame = requestAnimationFrame(animate);
        }

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            
            // Включаем музыку
            music.play().catch(e => console.log("Музыка ждет клика"));
            
            // Очищаем экран перед стартом
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            createHeart();
            animate();
            isStarted = true;

            // Показываем текст с задержкой
            setTimeout(() => {
                message.style.opacity = 1;
            }, 3000);
        });
    </script>
</body>
</html>
