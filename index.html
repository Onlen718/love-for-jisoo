<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Jisoo ❤️</title>
    <style>
        /* Жестко фиксируем черный фон */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000 !important; 
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Холст на весь экран */
        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
        }

        audio {
            display: none;
        }

        /* Контейнер для кнопки, чтобы она была по центру */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none; /* Чтобы клики проходили сквозь пустые места */
        }

        #start-btn {
            pointer-events: auto;
            padding: 15px 40px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #ff4d94;
            border: 2px solid #ff4d94;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: inherit;
            box-shadow: 0 0 20px rgba(255, 77, 148, 0.4);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        #start-btn:hover {
            background-color: #ff4d94;
            color: #000;
            box-shadow: 0 0 40px rgba(255, 77, 148, 0.8);
            transform: scale(1.05);
        }

        #message {
            position: absolute;
            bottom: 50px;
            z-index: 10;
            font-size: 1.2rem;
            text-align: center;
            width: 100%;
            color: #fff;
            opacity: 0;
            transition: opacity 4s ease-in-out;
            text-shadow: 0 0 15px #ff4d94;
            line-height: 1.8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <canvas id="heartCanvas"></canvas>

    <div class="ui-container">
        <button id="start-btn">Нажми на меня ❤️</button>
    </div>

    <div id="message">
        I Love You So, Jisoo...<br>
        <span style="font-size: 0.9rem; color: #ff80bf;">Твой Oppa 🛠️</span>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const music = document.getElementById('bg-music');
        const message = document.getElementById('message');

        let width, height, cx, cy;
        let particles = [];
        let sparks = [];
        let isStarted = false;
        let time = 0;

        // Настройка размера холста
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', () => {
            resize();
            if (isStarted) initHeart(); // Пересоздаем при изменении размера
        });
        resize();

        // Класс "Луча" (линии от центра к краю)
        class Ray {
            constructor() {
                let scale = Math.min(width, height) / 50; // Размер сердца
                let t = Math.random() * Math.PI * 2; // Случайный угол
                
                // Формула сердца
                let x0 = 16 * Math.pow(Math.sin(t), 3);
                let y0 = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                
                // Внешняя точка
                this.ox = x0 * scale;
                this.oy = y0 * scale;
                
                // Внутренняя точка (случайная длина луча)
                this.len = 0.3 + Math.random() * 0.6; // От 30% до 90% длины
                
                // Цвета для объема
                let rand = Math.random();
                if (rand > 0.85) this.color = 'rgba(255, 255, 255, 0.8)'; // Белые блики
                else if (rand > 0.4) this.color = 'rgba(255, 77, 148, 0.6)'; // Розовый
                else this.color = 'rgba(163, 0, 41, 0.4)'; // Темный
                
                this.width = Math.random() * 1.5 + 0.5; // Толщина линии
            }
            
            draw(scaleModifier) {
                // Вычисляем пульсацию (биение)
                let currentScale = scaleModifier;
                
                ctx.beginPath();
                // Внутренняя точка
                ctx.moveTo(cx + this.ox * this.len * currentScale, cy + this.oy * this.len * currentScale);
                // Внешняя точка
                ctx.lineTo(cx + this.ox * currentScale, cy + this.oy * currentScale);
                
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.width;
                ctx.stroke();
            }
        }

        // Класс "Искры" (летающие точки)
        class Spark {
            constructor() {
                this.x = cx + (Math.random() - 0.5) * 300;
                this.y = cy + (Math.random() - 0.5) * 300;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random();
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                // Если искра улетает далеко, возвращаем её
                if (Math.abs(this.x - cx) > 400 || Math.abs(this.y - cy) > 400) {
                    this.x = cx + (Math.random() - 0.5) * 200;
                    this.y = cy + (Math.random() - 0.5) * 200;
                }
                // Мерцание
                this.alpha += (Math.random() - 0.5) * 0.1;
                if(this.alpha > 1) this.alpha = 1;
                if(this.alpha < 0) this.alpha = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        // Инициализация
        function initHeart() {
            particles = [];
            sparks = [];
            // Количество лучей (чем больше, тем плотнее)
            for (let i = 0; i < 2500; i++) {
                particles.push(new Ray());
            }
            // Добавляем искры
            for (let i = 0; i < 50; i++) {
                sparks.push(new Spark());
            }
        }

        // Цикл анимации
        function animate() {
            // Очищаем экран (делаем шлейф)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; 
            ctx.fillRect(0, 0, width, height);

            // Пульсация (синусоида от 0.95 до 1.05)
            time += 0.05;
            let pulse = 1 + Math.sin(time) * 0.05;

            // Рисуем лучи
            for (let i = 0; i < particles.length; i++) {
                particles[i].draw(pulse);
            }

            // Рисуем искры
            for (let i = 0; i < sparks.length; i++) {
                sparks[i].update();
                sparks[i].draw();
            }

            requestAnimationFrame(animate);
        }

        // Обработчик кнопки
        startBtn.addEventListener('click', () => {
            document.querySelector('.ui-container').style.display = 'none'; // Убираем кнопку
            
            // Включаем музыку
            music.play().catch(e => console.log("Музыка заблокирована браузером"));
            
            // Очищаем экран перед стартом
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            initHeart();
            if (!isStarted) {
                animate();
                isStarted = true;
            }

            // Показываем текст
            setTimeout(() => {
                message.style.opacity = 1;
            }, 4000);
        });
    </script>
</body>
</html>
