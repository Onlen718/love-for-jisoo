
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Jisoo ❤️</title>

    <style>
        :root {
            --pink: #f6a6c9;
            --rose: #f5b5a8;
            --lilac: #c9b6f4;
            --text: #fff0f7;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Courier New", monospace;
            background:
                radial-gradient(
                    ellipse at 50% 42%,
                    #493044 0%,
                    #302039 38%,
                    #1c172b 75%,
                    #141321 100%
                );
            color: var(--text);
        }

        /* Холст с сердцем и частицами */

        #heartCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Небольшое свечение на фоне */

        .ambient-glow {
            position: absolute;
            width: 45vw;
            height: 45vw;
            min-width: 280px;
            min-height: 280px;
            max-width: 650px;
            max-height: 650px;
            left: 50%;
            top: 43%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(226, 143, 190, 0.13),
                rgba(186, 151, 222, 0.05) 45%,
                transparent 70%
            );
            pointer-events: none;
            z-index: 0;
        }

        /* Кнопка запуска */

        .ui-container {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .ui-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #start-btn {
            padding: 16px 32px;
            border: 1px solid rgba(255, 205, 226, 0.65);
            border-radius: 50px;
            background: rgba(69, 42, 69, 0.58);
            backdrop-filter: blur(12px);
            color: #ffe3f0;
            font: inherit;
            font-size: clamp(13px, 2vw, 17px);
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow:
                0 0 25px rgba(238, 157, 202, 0.12),
                inset 0 0 18px rgba(255, 255, 255, 0.03);
            transition:
                transform 0.35s ease,
                background 0.35s ease,
                box-shadow 0.35s ease;
            animation: button-appear 1.5s ease both;
        }

        #start-btn:hover {
            transform: scale(1.045);
            background: rgba(113, 67, 103, 0.7);
            box-shadow:
                0 0 35px rgba(238, 157, 202, 0.24),
                inset 0 0 20px rgba(255, 255, 255, 0.06);
        }

        #start-btn:active {
            transform: scale(0.98);
        }

        @keyframes button-appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Надписи остаются внизу */

        #message {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 100%;
            z-index: 5;
            padding: 0 16px;
            text-align: center;
            color: #ffe8f2;
            font-size: clamp(15px, 2.5vw, 21px);
            line-height: 1.8;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(10px);
            transition:
                opacity 2.5s ease,
                transform 2.5s ease;
            text-shadow: 0 0 18px rgba(246, 166, 201, 0.3);
            pointer-events: none;
        }

        #message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #message span {
            display: inline-block;
            margin-top: 2px;
            color: #d9c5f6;
            font-size: 0.9em;
            text-shadow: 0 0 14px rgba(201, 182, 244, 0.3);
        }

        /* Уважение к настройке уменьшения анимаций */

        @media (prefers-reduced-motion: reduce) {
            #start-btn {
                animation: none;
            }

            *, *::before, *::after {
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <div class="ambient-glow"></div>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <canvas id="heartCanvas"></canvas>

    <div class="ui-container" id="ui">
        <button id="start-btn">Click on me ❤️</button>
    </div>

    <div id="message">
        I Love You So, Jisoo...<br>
        <span>Your Oppa 🛠️</span>
    </div>

    <script>
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        const startBtn = document.getElementById("start-btn");
        const ui = document.getElementById("ui");
        const music = document.getElementById("bg-music");
        const message = document.getElementById("message");

        let width, height, cx, cy, dpr;
        let particles = [];
        let petals = [];
        let started = false;
        let startTime = 0;
        let animationId;

        const reduceMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;

        // Палитра сердца: розовый, персиковый, сиреневый.

        const heartColors = [
            { stop: 0, color: "#f8d4e7" },
            { stop: 0.28, color: "#f5b5c8" },
            { stop: 0.55, color: "#efa6c9" },
            { stop: 0.78, color: "#d9b5ef" },
            { stop: 1, color: "#b9a9ee" }
        ];

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            cx = width / 2;
            cy = height * 0.43;

            if (started) {
                initHeart();
            }
        }

        window.addEventListener("resize", resize);

        // Размер сердца подстраивается под экран.

        function getHeartScale() {
            return Math.min(
                width * 0.021,
                height * 0.0155,
                14
            );
        }

        // Уравнение сердца.
        // Точки внутри этой фигуры образуют заполненное сердце.

        function isInsideHeart(x, y) {
            const a = x * x + y * y - 1;

            return a * a * a - x * x * y * y * y <= 0;
        }

        function getHeartPoint() {
            let x, y;

            do {
                x = Math.random() * 2.8 - 1.4;
                y = Math.random() * 2.5 - 1.1;
            } while (!isInsideHeart(x, y));

            return { x, y };
        }

        
        class HeartParticle {
            constructor() {
                const point = getHeartPoint();
                const scale = getHeartScale();

                // Конечная позиция частицы внутри сердца.
                this.tx = point.x * 16 * scale;
                this.ty = -point.y * 16 * scale;

                // Начальная позиция находится за границами экрана.
                const angle = Math.random() * Math.PI * 2;

                // Выбираем точку на одной из сторон экрана.
                const side = Math.floor(Math.random() * 4);

                const margin = 80 + Math.random() * 250;

                if (side === 0) {
                    this.sx = -width / 2 - margin;
                    this.sy = (Math.random() - 0.5) * height * 2;
                } else if (side === 1) {
                    this.sx = width / 2 + margin;
                    this.sy = (Math.random() - 0.5) * height * 2;
                } else if (side === 2) {
                    this.sx = (Math.random() - 0.5) * width * 2;
                    this.sy = -height / 2 - margin;
                } else {
                    this.sx = (Math.random() - 0.5) * width * 2;
                    this.sy = height / 2 + margin;
                }

                // Небольшое случайное смещение траектории.
                this.sx += Math.cos(angle) * 100;
                this.sy += Math.sin(angle) * 100;

                this.x = this.sx;
                this.y = this.sy;

                this.size = 0.7 + Math.random() * 1.5;

                // Частицы появляются в разное время.
                this.delay = Math.random() * 0.65;

                this.alpha = 0;
                this.twinkle = Math.random() * Math.PI * 2;
                this.speed = 0.75 + Math.random() * 0.5;
            }

            update(progress, pulse) {
                const p = Math.max(
                    0,
                    Math.min(
                        1,
                        (progress - this.delay) / (1 - this.delay)
                    )
                );

                // Плавный разгон и замедление при сборке.
                const eased = p * p * (3 - 2 * p);

                this.x = this.sx + (this.tx - this.sx) * eased;
                this.y = this.sy + (this.ty - this.sy) * eased;

                // Частицы постепенно становятся видимыми.
                this.alpha = Math.min(1, p * 2.5) * 0.92;

                const breath = 1 + Math.sin(
                    performance.now() * 0.0018 * this.speed +
                    this.twinkle
                ) * 0.1;

                this.draw(eased, pulse * breath);
            }

            draw(progress, pulse) {
                const x = cx + this.x * pulse;
                const y = cy + this.y * pulse;

                const colorPosition = Math.max(
                    0,
                    Math.min(
                        1,
                        (this.ty / (getHeartScale() * 16) + 1.1) / 2.5
                    )
                );

                const color = getGradientColor(colorPosition);

                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = color;

                // Свечение движущихся частиц.
                if (progress < 0.95) {
                    ctx.globalAlpha = this.alpha * 0.22;
                    ctx.beginPath();
                    ctx.arc(x, y, this.size * 3.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Основная частица.
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(
                    x,
                    y,
                    this.size * (0.5 + progress * 0.5),
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                ctx.globalAlpha = 1;
            }
        }


        function getGradientColor(t) {
            for (let i = 0; i < heartColors.length - 1; i++) {
                const a = heartColors[i];
                const b = heartColors[i + 1];

                if (t >= a.stop && t <= b.stop) {
                    const k = (t - a.stop) / (b.stop - a.stop);

                    const ca = hexToRgb(a.color);
                    const cb = hexToRgb(b.color);

                    const r = Math.round(ca.r + (cb.r - ca.r) * k);
                    const g = Math.round(ca.g + (cb.g - ca.g) * k);
                    const bl = Math.round(ca.b + (cb.b - ca.b) * k);

                    return `rgb(${r}, ${g}, ${bl})`;
                }
            }

            return heartColors[heartColors.length - 1].color;
        }

        function hexToRgb(hex) {
            return {
                r: parseInt(hex.slice(1, 3), 16),
                g: parseInt(hex.slice(3, 5), 16),
                b: parseInt(hex.slice(5, 7), 16)
            };
        }

        function initHeart() {
            particles = [];

            // Количество частиц сердца.
            // Уменьшай число, если нужен более слабый эффект.

            const count = width < 600 ? 1400 : 2400;

            for (let i = 0; i < count; i++) {
                particles.push(new HeartParticle());
            }
        }

        // Падающие цветки сакуры.
        // Они полупрозрачные, небольшие и не перекрывают сердце.

        class SakuraPetal {
            constructor(initial = false) {
                this.reset(initial);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial
                    ? Math.random() * height
                    : -20 - Math.random() * 100;

                this.size = 3 + Math.random() * 4.5;
                this.speed = 0.35 + Math.random() * 0.65;
                this.drift = 0.25 + Math.random() * 0.55;
                this.phase = Math.random() * Math.PI * 2;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.018;
                this.alpha = 0.22 + Math.random() * 0.24;

                const colors = [
                    "#f8c8dc",
                    "#edb6d4",
                    "#f6d8e8",
                    "#d9c5f2"
                ];

                this.color = colors[
                    Math.floor(Math.random() * colors.length)
                ];
            }

            update(time) {
                this.y += this.speed;
                this.x += Math.sin(
                    time * 0.0007 + this.phase
                ) * this.drift;

                this.rotation += this.rotationSpeed;

                if (this.y > height + 20) {
                    this.reset();
                }

                this.draw();
            }

            draw() {
                ctx.save();

                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;

                // Форма лепестка.

                ctx.beginPath();
                ctx.moveTo(0, -this.size);

                ctx.bezierCurveTo(
                    this.size * 0.85,
                    -this.size * 0.7,
                    this.size,
                    this.size * 0.35,
                    0,
                    this.size
                );

                ctx.bezierCurveTo(
                    -this.size,
                    this.size * 0.35,
                    -this.size * 0.85,
                    -this.size * 0.7,
                    0,
                    -this.size
                );

                ctx.fill();
                ctx.restore();
            }
        }

        function initPetals() {
            petals = [];

            // На мобильных устройствах цветков меньше.

            const count = width < 600 ? 13 : 22;

            for (let i = 0; i < count; i++) {
                petals.push(new SakuraPetal(true));
            }
        }

        function animate(now) {
            ctx.clearRect(0, 0, width, height);

            const elapsed = (now - startTime) / 1000;

            // Сердце собирается постепенно.

            const progress = reduceMotion
                ? 1
                : Math.min(1, elapsed / 5);

            // Лёгкое биение начинается после появления.

            const pulse = progress < 1
                ? 1
                : 1 + Math.sin(now * 0.0018) * 0.018;

            // Мягкое свечение за сердцем.

            if (progress > 0.2) {
                const glow = ctx.createRadialGradient(
                    cx, cy, 5,
                    cx, cy, getHeartScale() * 240
                );

                glow.addColorStop(
                    0,
                    `rgba(240, 166, 207, ${0.07 * progress})`
                );
                glow.addColorStop(
                    0.5,
                    `rgba(197, 164, 232, ${0.035 * progress})`
                );
                glow.addColorStop(1, "rgba(0, 0, 0, 0)");

                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, width, height);
            }

            for (const particle of particles) {
                particle.update(progress, pulse);
            }

            // Сакура движется независимо от появления сердца.

            for (const petal of petals) {
                petal.update(now);
            }

            ctx.globalAlpha = 1;

            animationId = requestAnimationFrame(animate);
        }

        // Запуск анимации по нажатию.

        startBtn.addEventListener("click", () => {
            if (started) return;

            started = true;
            startTime = performance.now();

            ui.classList.add("hidden");

            initHeart();
            initPetals();

            // Браузер может запретить музыку,
            // если файл отсутствует или недоступен.

            music.volume = 0.35;
            music.play().catch(() => {
                console.log(
                    "Не удалось запустить музыку. Проверь файл song.mp3."
                );
            });

            animationId = requestAnimationFrame(animate);

            // Надпись плавно проявляется после появления сердца.

            setTimeout(() => {
                message.classList.add("visible");
            }, reduceMotion ? 500 : 4800);
        });

        // Первичная настройка холста.

        resize();
    </script>

</body>
</html>
